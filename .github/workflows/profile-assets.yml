name: Update profile assets

# publish: builds the daily images the profile README uses — the numbers and
#   languages pair, the contribution calendar and the colophon with its status
#   check of the linked sites, all rendered by scripts/readme/live.mjs — and
#   publishes them to the `output` branch. Generating them here instead of
#   hot-linking public services avoids rate limits and paused deployments.
# verify: on every push and pull request that touches the generator, checks
#   that the committed assets/ and README.md are what scripts/readme builds,
#   that the daily images still render, and that the GraphQL queries the
#   daily run sends are valid against GitHub's published schema.

on:
  schedule:
    - cron: "17 3 * * *" # daily at 08:47 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-assets.yml
      - scripts/readme/**
      - assets/**
      - README.md
  pull_request:
    paths:
      - .github/workflows/profile-assets.yml
      - scripts/readme/**
      - assets/**
      - README.md

permissions:
  contents: read

jobs:
  verify:
    name: Generated files are up to date
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: profile-assets-verify-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/readme/package-lock.json

      - name: Install renderer dependencies
        working-directory: scripts/readme
        run: npm ci --omit=dev

      - name: Rebuild assets and README
        working-directory: scripts/readme
        run: node build.mjs

      - name: Fail if the committed output is stale
        run: |
          stale="$(git status --porcelain -- assets README.md)"
          if [ -n "$stale" ]; then
            echo "$stale"
            git --no-pager diff --stat -- assets README.md
            echo "::error::assets/ or README.md does not match scripts/readme. Run 'npm run build' in scripts/readme and commit the result."
            exit 1
          fi

      - name: Render the daily images from mock data
        working-directory: scripts/readme
        run: node live.mjs --out "$RUNNER_TEMP/live-preview" --mock

      # The steps above ran without dev dependencies, which proves the renderer
      # needs none; this one adds them for the `graphql` validator. A query
      # typo would otherwise only surface in the first publish run after merge.
      # If GitHub's schema cannot be downloaded the check is skipped with a
      # warning instead of failing the job.
      - name: Check the GraphQL queries against GitHub's schema
        working-directory: scripts/readme
        run: |
          npm ci
          schema="$RUNNER_TEMP/schema.docs.graphql"
          if ! curl -fsSL --retry 3 --max-time 60 -o "$schema" https://docs.github.com/public/fpt/schema.docs.graphql; then
            echo "::warning::Could not download GitHub's GraphQL schema, so the queries in scripts/readme/live/github.mjs were not checked."
            exit 0
          fi
          node live.mjs --validate-schema "$schema"

  publish:
    name: Build and publish live images
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push to the output branch
      actions: write # keep the schedule enabled (last step)
    concurrency:
      group: profile-assets-publish
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/readme/package-lock.json

      - name: Install renderer dependencies
        working-directory: scripts/readme
        run: npm ci --omit=dev

      # Without a STATS_TOKEN secret the built-in token only sees public
      # repositories and public contributions, so the languages image is
      # labelled "public repos". To count private work too, add a STATS_TOKEN
      # secret (classic PAT with `read:user` and `repo` scopes). If it expires,
      # live.mjs falls back to the built-in token and leaves a warning on the run.
      # live.mjs exits non-zero when the GitHub API fails, which stops the job
      # before publishing, so the previously published images stay in place.
      # The colophon's site check (one GET per site from this runner, 15 s
      # timeout, one retry after 3 s) never fails the job: a site that is down
      # is printed in red and flagged with a warning on the run.
      - name: Numbers, languages, calendar and colophon
        working-directory: scripts/readme
        # The profile repo itself is excluded so the generator code does not skew languages.
        run: node live.mjs --out ../../dist --exclude "${GITHUB_REPOSITORY#*/}"
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update profile assets"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub disables scheduled workflows in public repositories after 60
      # days without repository activity, and this job's pushes to `output`
      # are not guaranteed to count. Re-enabling the workflow through the API
      # (as gautamkrishnar/keepalive-workflow does) keeps the schedule alive
      # without commits to main. Runs even when an earlier step failed.
      - name: Keep the daily schedule enabled
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        continue-on-error: true
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/profile-assets.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
