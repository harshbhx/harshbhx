name: Update profile assets

# Builds the live images the profile README uses (the activity cards rendered
# by scripts/readme/live.mjs and the contribution snake) and publishes them to
# the `output` branch. Generating them here instead of hot-linking public
# services avoids rate limits and paused deployments.

on:
  schedule:
    - cron: "17 3 * * *" # daily at 08:47 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-assets.yml
      - scripts/readme/live.mjs
      - scripts/readme/live/**
      - scripts/readme/lib/**
      - scripts/readme/readme.mjs
      - scripts/readme/package-lock.json

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/readme/package-lock.json

      - name: Install renderer dependencies
        working-directory: scripts/readme
        run: npm ci --omit=dev

      # Uses the built-in token, which only sees public activity. To include
      # private contributions, add a STATS_TOKEN secret (classic PAT with
      # `read:user` and `repo` scopes). live.mjs exits non-zero on any API
      # failure, which stops the job before publishing, so the previously
      # published images stay in place.
      - name: Activity cards
        working-directory: scripts/readme
        # The profile repo itself is excluded so the generator code does not skew languages.
        run: node live.mjs --out ../../dist --exclude "${GITHUB_REPOSITORY#*/}"
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      # Colours follow scripts/readme/lib/theme.mjs: GitHub's empty-cell grey,
      # then the violet ramp; the snake uses the theme's sky token.
      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#7dd3fc&color_dots=#161b22,#41336d,#7c3aed,#a78bfa,#ddd6fe
            dist/snake-light.svg?color_snake=#0369a1&color_dots=#ebedf0,#ddd6fe,#a78bfa,#7c3aed,#4c1d95

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update profile assets"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
